[project]
name = "a504-studio"
version = "0.1.0"
description = "작품 제작 로직: 기획 · 소재 생성 · 검사 · 조립 · 전달"
requires-python = ">=3.12"
dependencies = [
    "a504-contracts",
    "a504-db",
    "httpx>=0.28,<1",
    "interactive-controller",   # UE 숫자 변환·검사 (controller/, 표준 라이브러리만)
    "psutil>=7,<8",
    "pydantic>=2",
    "sqlmodel>=0.0.22",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "studio"
