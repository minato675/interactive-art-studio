[project]
name = "a504-operator"
version = "0.1.0"
description = "운영 PC 앱: central API로 작품을 요청(자동·편집 모드)하고 진행·기록을 본다"
requires-python = ">=3.12"
dependencies = [
    "a504-contracts",
    "httpx>=0.27",
    "pyside6-essentials>=6.8",   # Qt Widgets만. LGPL — 팀 승인 대기 (docs/THIRD_PARTY.md)
]

[project.scripts]
a504-operator = "operator_app.__main__:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "operator_app"
