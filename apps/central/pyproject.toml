[project]
name = "a504-central"
version = "0.1.0"
description = "중앙 서버 (EC2 목표): 운영 API · 운영 화면 · 작품 제작 순서"
requires-python = ">=3.12"
dependencies = [
    "a504-contracts",
    "a504-db",
    "a504-studio",
    "celery>=5.6,<6",
    "fastapi>=0.115",
    "sqlmodel>=0.0.22",
    "uvicorn>=0.30",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "central"
