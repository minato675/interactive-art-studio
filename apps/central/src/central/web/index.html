<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>작품 만들기</title>
<style>
  :root { --ink: #1c2034; --sub: #606880; --line: #dde1ec; --accent: #3b5bdb; --bg: #f6f7fb; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Malgun Gothic", system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  p.hint { color: var(--sub); margin: 0 0 20px; }
  fieldset { border: 1px solid var(--line); border-radius: 12px; background: #fff; margin: 0 0 14px; padding: 14px 16px; }
  legend { font-weight: 700; padding: 0 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  label { display: inline-flex; gap: 6px; align-items: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .card small { display: block; color: var(--sub); margin-left: 22px; }
  .todo { opacity: .6; }
  input[type=text], select, input[type=number], input[type=password] { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  input[type=text] { width: 100%; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 12px 20px; font: inherit; font-weight: 700; cursor: pointer; }
  ol.steps { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 14px 36px; }
  ol.steps li { margin: 6px 0; }
  pre { white-space: pre-wrap; word-break: break-all; color: var(--sub); margin: 2px 0 0; font-size: 12px; }
  .status { font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>작품 만들기</h1>
  <p class="hint">개발 프리뷰 화면입니다. 만든 파일이 실제 전시에 적용되었는지는 별도로 확인해야 합니다.</p>
  <p class="hint">입력은 처음 한 번만 받습니다. 비워 두면 AI가 정합니다.</p>
  <form id="form">
    <fieldset><legend>모드</legend>
      <div class="row">
        <label><input type="radio" name="mode" value="manual" checked> 직접 만들기</label>
        <label><input type="radio" name="mode" value="exhibition"> 전시 모드 (자동 요청 · 매번 새로 생성)</label>
      </div>
    </fieldset>
    <fieldset><legend>테마</legend>
      <p><input type="text" name="theme" maxlength="2000" placeholder="자유 문장 (예: 비 온 뒤 고요한 밤바다 · 비워 두면 AI가 테마를 고름)"></p>
    </fieldset>
    <fieldset><legend>주인공 · 드러내기 요구</legend>
      <p class="hint" style="margin:0 0 8px">전시 모드는 자율 기획, 사용자 제작은 입력에 근거해 기획합니다. 미지원 요청은 오류 처리하며, both는 TD·UE 모두 성공해야 후보 준비가 완료됩니다.</p>
      <p><input type="text" name="subject" maxlength="40" placeholder="예: 고래, 사슴 (사용자 제작은 원문에서 추출)"></p>
      <div class="row">
        <label><input type="radio" name="reveal" value="" checked> AI에게 맡기기</label>
        <label><input type="radio" name="reveal" value="formation"> 형상 (작은 것들이 모여 잠깐 주인공 모양)</label>
        <label><input type="radio" name="reveal" value="trace"> 흔적 (지나간 자리에 자국)</label>
        <label><input type="radio" name="reveal" value="none"> 드러내기 없음</label>
      </div>
    </fieldset>
    <fieldset><legend>선택 칩</legend><div class="row" id="chips"></div></fieldset>
    <fieldset><legend>표현 방식 (최대 3개 · 비우면 AI)</legend><div class="grid" id="families"></div></fieldset>
    <fieldset><legend>입력 종류</legend>
      <div class="row">
        <label><input type="checkbox" name="inputs" value="hand" checked> 손</label>
        <label><input type="checkbox" name="inputs" value="touch"> 터치</label>
        <label><input type="checkbox" name="inputs" value="body"> 몸 (예정)</label>
        <label><input type="checkbox" name="inputs" value="sound"> 소리 (예정)</label>
      </div>
    </fieldset>
    <fieldset><legend>연출 · 시간 구조</legend>
      <div class="row">
        <label><input type="radio" name="direction" value="none"> 표현만</label>
        <label><input type="radio" name="direction" value="mood" checked> 분위기</label>
        <label><input type="radio" name="direction" value="story"> 스토리</label>
      </div>
      <div class="row" style="margin-top:8px">
        <label><input type="radio" name="timeline" value="loop" checked> 반복</label>
        <label><input type="radio" name="timeline" value="stages"> 단계 전환 (예정)</label>
        <label><input type="radio" name="timeline" value="accumulate"> 반응 누적 (예정)</label>
        <label>단계 수 <input type="number" name="stages" min="2" max="5" value="3"></label>
      </div>
    </fieldset>
    <fieldset><legend>소재</legend>
      <div class="row">
        <label><input type="radio" name="assets" value="auto" checked> 맡기기</label>
        <label><input type="radio" name="assets" value="pool"> 풀에서 고르기</label>
        <label><input type="radio" name="assets" value="new"> 새로 만들기</label>
      </div>
    </fieldset>
    <div class="row">
      <button type="submit">작품 만들기</button>
      <label>운영자 토큰 <input type="password" id="token" autocomplete="off"></label>
    </div>
  </form>
  <h2>결과</h2>
  <p id="summary" class="hint">아직 만든 작품이 없습니다.</p>
  <ol class="steps" id="steps" hidden></ol>
</main>
<script>
const CHIPS = {
  mood: ["분위기", {calm: "고요", dreamy: "몽환", mysterious: "신비", joyful: "경쾌"}],
  composition: ["구도", {center: "가운데", horizon: "수평", diagonal: "대각선", scattered: "흩어짐"}],
  focus: ["초점", {near: "가까이", far: "멀리", whole: "전체"}],
  space: ["여백", {open_center: "가운데 비움", full: "꽉 채움"}],
  palette: ["색감", {cool: "차갑게", warm: "따뜻하게", night: "밤", pastel: "파스텔"}],
  intensity: ["반응 세기", {gentle: "살며시", normal: "보통", strong: "힘차게"}],
};
const form = document.getElementById("form");
const chipBox = document.getElementById("chips");
for (const [name, [label, options]] of Object.entries(CHIPS)) {
  const select = document.createElement("select");
  select.name = "chip_" + name;
  select.add(new Option(label + ": AI", ""));
  for (const [value, text] of Object.entries(options)) select.add(new Option(label + ": " + text, value));
  chipBox.append(select);
}
fetch("/api/families").then(r => r.json()).then(list => {
  const box = document.getElementById("families");
  for (const f of list) {
    const card = document.createElement("label");
    card.className = "card" + (f.status === "todo" ? " todo" : "");
    const needs = f.needs.length ? f.needs.join(", ") : "없음";
    card.innerHTML = `<input type="checkbox" name="families" value="${f.key}"> ${f.label}` +
      `<small>소재: ${needs}${f.status === "todo" ? " · UE 연결 예정" : ""}</small>`;
    box.append(card);
  }
});
function body() {
  const data = new FormData(form);
  const chips = {};
  for (const name of Object.keys(CHIPS)) if (data.get("chip_" + name)) chips[name] = data.get("chip_" + name);
  return {
    mode: data.get("mode"), theme: data.get("theme").trim(), chips,
    families: data.getAll("families"), inputs: data.getAll("inputs").length ? data.getAll("inputs") : ["hand"],
    direction: data.get("direction"), timeline: data.get("timeline"), stages: Number(data.get("stages")),
    assets: data.get("assets"), subject: data.get("subject").trim(), reveal: data.get("reveal") || null,
  };
}
form.addEventListener("submit", async event => {
  event.preventDefault();
  const summary = document.getElementById("summary");
  const steps = document.getElementById("steps");
  summary.textContent = "만드는 중…";
  const headers = {"Content-Type": "application/json"};
  const token = document.getElementById("token").value;
  if (token) headers["X-Operator-Token"] = token;
  const response = await fetch("/api/artworks", {method: "POST", headers, body: JSON.stringify(body())});
  const result = await response.json();
  if (!response.ok) {
    summary.textContent = "입력 오류: " + JSON.stringify(result.detail);
    steps.hidden = true;
    return;
  }
  const label = {prepared: "필수 후보 파일 준비 완료 · Ready·Applied 미확인", published: "과거 게시 기록 · 실제 적용 미확인", held: "보류 — 지금 작품 유지", failed: "실패 — 지금 작품 유지"}[result.status] || result.status;
  summary.textContent = `${label} · ${result.title}`;
  steps.replaceChildren(...result.steps.map(s => {
    const item = document.createElement("li");
    item.textContent = s.name;
    const detail = document.createElement("pre");
    detail.textContent = typeof s.detail === "string" ? s.detail : JSON.stringify(s.detail, null, 1);
    item.append(detail);
    return item;
  }));
  steps.hidden = false;
});
</script>
</body>
</html>
