workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
    - when: never

stages: [check, test, build, deploy]

default:
  tags: [linux-docker]
  interruptible: true

variables:
  UV_LINK_MODE: copy
  UV_CACHE_DIR: .uv-cache
  UV_PYTHON_DOWNLOADS: never
  QT_QPA_PLATFORM: offscreen
  EC2_HOST: k15a504.p.ssafy.io
  EC2_USER: ubuntu

.python:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58
  cache:
    key:
      prefix: $CI_JOB_NAME
      files: [uv.lock]
    paths: [.uv-cache]
  before_script:
    - uv sync --locked

lint:
  extends: .python
  stage: check
  script:
    - uv run ruff check .
    - uv lock --check
    - bash -n infra/central/preflight.sh infra/central/deploy.sh
    - sh -n infra/central/ci_deploy.sh

unit-tests:
  extends: .python
  stage: test
  script:
    - uv run pytest --ignore=tests/test_operator.py --ignore=tests/test_operator_monitor.py --ignore=tests/test_operator_feedback.py --ignore=tests/test_operator_login.py --ignore=tests/test_operator_dashboard.py --ignore=tests/test_operator_native_artworks.py --ignore=tests/test_operator_show_operations.py --ignore=tests/test_infra_postgres.py --ignore=tests/test_head_auto_postgres.py --junitxml=runtime/junit-unit.xml
  artifacts:
    when: always
    reports:
      junit: runtime/junit-unit.xml

operator-tests:
  extends: .python
  stage: test
  script:
    - apt-get update && apt-get install -y --no-install-recommends libgl1 libegl1 libopengl0 libdbus-1-3 libxkbcommon0 libglib2.0-0 libfontconfig1 libfreetype6
    - uv sync --locked --all-packages
    - uv run --all-packages python -c 'import PySide6.QtWidgets'
    - uv run --all-packages pytest tests/test_operator.py tests/test_operator_monitor.py tests/test_operator_feedback.py tests/test_operator_login.py tests/test_operator_dashboard.py tests/test_operator_native_artworks.py tests/test_operator_show_operations.py --junitxml=runtime/junit-operator.xml
  artifacts:
    when: always
    reports:
      junit: runtime/junit-operator.xml

controller-tests:
  extends: .python
  stage: test
  script:
    - PYTHONPATH=controller/src:controller/tests uv run pytest controller/tests --junitxml=runtime/junit-controller.xml
  artifacts:
    when: always
    reports:
      junit: runtime/junit-controller.xml

integration-tests:
  extends: .python
  stage: test
  services:
    - name: postgres:16-bookworm
      alias: postgres
    - name: rabbitmq:4.2
      alias: rabbitmq
  variables:
    POSTGRES_DB: ranel_infra_test
    POSTGRES_USER: ranel_test
    # 일회성 CI 컨테이너 전용. 운영 비밀번호로 사용하지 않는다.
    POSTGRES_PASSWORD: ci_ephemeral_only
    TEST_POSTGRES_URL: postgresql+pg8000://ranel_test:ci_ephemeral_only@postgres:5432/ranel_infra_test
    RABBITMQ_DEFAULT_USER: ranel_test
    RABBITMQ_DEFAULT_PASS: ci_ephemeral_only
    RABBITMQ_DEFAULT_VHOST: ranel
    BROKER_URL: amqp://ranel_test:ci_ephemeral_only@rabbitmq:5672/ranel
  script:
    - test -n "$TEST_POSTGRES_URL" && test -n "$BROKER_URL"
    - uv run pytest tests/test_infra_postgres.py tests/test_head_auto_postgres.py --junitxml=runtime/junit-integration.xml
    - DATABASE_URL="$TEST_POSTGRES_URL" uv run python infra/check_pipeline.py
  artifacts:
    when: always
    reports:
      junit: runtime/junit-integration.xml

build-smoke:
  stage: build
  image: docker:29.9.1-cli@sha256:6fae2214c3121a28d5aa639d09032f61310b7c9c75ffbad1025f261a1b621800
  services:
    - name: docker:29.9.1-dind-rootless@sha256:825e451c9bd898245ca8fb07bd9a48999ccf33c0192fd68594c73aed7b67d11f
      alias: docker
      command: ["--label=ranel.ci.disposable=true", "--mtu=1400"]
  resource_group: ranel-ci-deploy-smoke
  timeout: 20m
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
    HEALTHCHECK_TCP_PORT: "2376"
  before_script:
    - apk add --no-cache bash python3 util-linux
    - docker info
  script:
    - docker build --pull --target runtime -f infra/central/Dockerfile -t "ranel-ci:$CI_COMMIT_SHA" .
    - docker run --rm -i --network none --workdir /tmp --entrypoint python "ranel-ci:$CI_COMMIT_SHA" -I - < infra/check_packaged_scene.py
    - python3 infra/ci_deploy_test.py --image "ranel-ci:$CI_COMMIT_SHA"
  artifacts:
    when: always
    expire_in: 7 days
    paths: [runtime/ci-deploy/]
    reports:
      junit: runtime/ci-deploy/junit.xml

.deploy_ec2:
  stage: deploy
  image: alpine:3.22
  interruptible: false
  resource_group: ranel-ec2
  timeout: 20m
  before_script:
    - apk add --no-cache openssh-client git
    - test -f "$SSH_PRIVATE_KEY" && test -f "$SSH_KNOWN_HOSTS"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$SSH_PRIVATE_KEY" ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
  script:
    - sh infra/central/ci_deploy.sh

deploy_ec2:
  extends: .deploy_ec2
  variables:
    DEPLOY_ENVIRONMENT: production
  environment:
    name: ec2/production
    url: https://k15a504.p.ssafy.io
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_COMMIT_REF_PROTECTED == "true" && $EC2_DEPLOY_ENABLED == "true"'
      when: on_success
    - when: never
