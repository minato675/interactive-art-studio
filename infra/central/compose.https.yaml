# 기본 compose.yaml과 함께 사용. DB·AMQP·기존 localhost API 포트는 변경하지 않는다.
services:
  gateway:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    environment:
      CENTRAL_HOST: ${CENTRAL_HOST:?set server IP or DNS name}
    ports:
      - "${CENTRAL_HTTPS_BIND:?set bind IP}:${CENTRAL_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile.internal:/etc/caddy/Caddyfile:ro
      - ./monitor:/srv/monitor:ro
      - gateway-data:/data
      - gateway-config:/config
    depends_on:
      central:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gateway-data:
  gateway-config:
